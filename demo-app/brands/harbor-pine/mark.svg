<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- The Harbor & Pine test brand's monogram: a light "HP" glyph on a dark field (the shape brands/<id>
       logos.mark takes; box 100,80 400x240). A throwaway brand that proves the app follows its brand pack. -->
  <rect width="600" height="400" fill="black"/>
  <g fill="white">
    <rect x="120" y="90" width="50" height="220"/>
    <rect x="260" y="90" width="50" height="220"/>
    <rect x="120" y="175" width="190" height="50"/>
    <rect x="340" y="90" width="50" height="220"/>
    <rect x="390" y="90" width="70" height="44"/>
    <rect x="436" y="90" width="44" height="130"/>
    <rect x="390" y="176" width="70" height="44"/>
  </g>
</svg>
