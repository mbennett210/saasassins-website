<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toggle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  .pv { padding: var(--space-6); }
  .pv .card { margin: 0; display: flex; flex-direction: column; gap: var(--space-3); }
  .pv-line { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); font-size: var(--font-size-md); color: var(--text-primary); }
</style>
</head>
<body>
<div id="pv" class="pv"></div>
<script>
var CS = window.CleanSpace, h = React.createElement;
function Line(p) {
  var s = React.useState(p.on);
  return h('div', { className: 'pv-line' }, h('span', null, p.label), h(CS.Toggle, { on: s[0], onChange: s[1], disabled: p.disabled }));
}
ReactDOM.createRoot(document.getElementById('pv')).render(
  h('div', { className: 'card' },
    h(Line, { label: 'Clock-in reminders', on: true }),
    h(Line, { label: 'Weekly summary email', on: false }),
    h(Line, { label: 'New clean assigned (always on for crew)', on: true, disabled: true }))
);
</script>
</body>
</html>
