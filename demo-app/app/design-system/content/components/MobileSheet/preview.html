<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MobileSheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="pv"></div>
<script>
var CS = window.CleanSpace, h = React.createElement;
var LOCS = [
  { value: 'hv', label: 'Harbor View Offices', group: 'Brickell' },
  { value: 'bm', label: 'Brickell Medical Suites', group: 'Brickell' },
  { value: 'cg', label: 'Coral Gables Law Group', group: 'Coral Gables' }
];
function Demo() {
  var a = React.useState(['hv']), b = React.useState(''), c = React.useState({ preset: 'week' });
  var active = (a[0].length ? 1 : 0) + (b[0] ? 1 : 0) + (c[0] ? 1 : 0);
  return h(CS.MobileSheet, {
    open: true,
    title: 'Filters',
    onClose: function () {},
    footer: h(React.Fragment, null,
      h('button', { type: 'button', className: 'facet-clear-all', onClick: function () { a[1]([]); b[1](''); c[1](null); } }, 'Clear all' + (active ? ' (' + active + ')' : '')),
      h('button', { type: 'button', className: 'btn btn-primary' }, 'Show results'))
  },
    h(CS.MultiFacet, { label: 'Locations', value: a[0], options: LOCS, onChange: a[1] }),
    h(CS.SegmentedFacet, { label: 'Crew size', value: b[0], options: [{ value: '', label: 'Any' }, { value: 'solo', label: 'Solo' }, { value: '2', label: '2' }, { value: '3', label: '3+' }], onChange: b[1] }),
    h(CS.DateRangeFacet, { label: 'Date range', value: c[0], presets: CS.DATE_PRESETS, onChange: c[1] })
  );
}
ReactDOM.createRoot(document.getElementById('pv')).render(h(Demo));
</script>
</body>
</html>
