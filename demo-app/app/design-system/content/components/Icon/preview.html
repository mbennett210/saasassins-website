<!-- @dsCard group="Iconography" height=460 width=720 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  .pv { padding: var(--space-5) var(--space-6); display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: var(--space-1) var(--space-2); }
  .pv-cell { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2) 0; color: var(--text-primary); }
  .pv-name { font-size: var(--font-size-2xs); color: var(--text-faint); }
</style>
</head>
<body>
<div id="pv" class="pv"></div>
<script>
var CS = window.CleanSpace, h = React.createElement;
var NAMES = ['dashboard', 'schedule', 'clients', 'invoices', 'reminders', 'messaging', 'settings', 'search', 'plus', 'edit', 'trash', 'check', 'x', 'camera', 'bell', 'bellOff', 'building', 'chart', 'dollarCircle', 'user', 'lock', 'logout', 'archive', 'tag', 'filter', 'mail', 'phone', 'mapPin', 'phoneSolid', 'mailSolid', 'messagingSolid', 'chevronRight', 'chevronLeft', 'arrowLeft', 'chevronUp', 'chevronDown', 'resizeGrip', 'dots', 'star', 'moon', 'folder', 'forms', 'expand', 'repeat', 'warning', 'paperclip', 'upload', 'box', 'grip'];
ReactDOM.createRoot(document.getElementById('pv')).render(h(React.Fragment, null,
  NAMES.map(function (n) { return h('div', { key: n, className: 'pv-cell' }, h(CS.Icon, { name: n, size: 20 }), h('span', { className: 'pv-name' }, n)); })
));
</script>
</body>
</html>
