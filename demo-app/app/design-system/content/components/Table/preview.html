<!-- @dsCard group="Data" height=428 width=960 page subtitle="CSS classes: .table-head, .table-wrap, table" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  .pv { padding: var(--space-6); }
</style>
</head>
<body>
<div id="pv" class="pv"></div>
<script>
var CS = window.CleanSpace, h = React.createElement;
var ROWS = [
  ['INV-1048', 'Harbor View Offices', 'Sep 1', 'Sep 15', '$1,480.00', '$0.00', 'Paid'],
  ['INV-1047', 'Brickell Medical Suites', 'Sep 1', 'Sep 15', '$2,215.50', '$2,215.50', 'Overdue'],
  ['INV-1046', 'Coral Gables Law Group', 'Aug 25', 'Sep 29', '$960.00', '$960.00', 'Pending'],
  ['INV-1045', 'Dadeland Dental', 'Aug 18', 'Sep 1', '$3,080.00', '$0.00', 'Paid'],
  ['INV-1044', 'Key Biscayne Yacht Club', 'Aug 18', 'Sep 1', '$1,125.00', '$1,125.00', 'Overdue']
];
function Demo() {
  var s = React.useState(''), q = s[0], setQ = s[1];
  var rows = ROWS.filter(function (r) { return !q || r.join(' ').toLowerCase().indexOf(q.toLowerCase()) >= 0; });
  return h(React.Fragment, null,
    h('div', { className: 'table-head' },
      h('h3', { className: 'table-head-title' }, 'Invoices'),
      h('div', { className: 'table-controls' },
        h(CS.TableSearch, { value: q, onChange: setQ, placeholder: 'Search invoices' }),
        q ? h('span', { className: 'table-count' }, rows.length + ' of ' + ROWS.length) : null)),
    h('div', { className: 'table-wrap mobile-stack' },
      h('table', null,
        h('thead', null, h('tr', null, ['Invoice', 'Company', 'Issued', 'Due', 'Total', 'Balance', 'Status', ''].map(function (t, i) { return h('th', { key: i }, t); }))),
        h('tbody', null, rows.map(function (r) {
          return h('tr', { key: r[0] },
            h('td', { className: 'name cell-primary' }, r[0]),
            h('td', { 'data-label': 'Company' }, h('span', { className: 'truncate', title: r[1] }, r[1])),
            h('td', { 'data-label': 'Issued' }, r[2]),
            h('td', { 'data-label': 'Due' }, r[3]),
            h('td', { className: 'money', 'data-label': 'Total' }, r[4]),
            h('td', { className: 'money', 'data-label': 'Balance' }, r[5]),
            h('td', { 'data-label': 'Status' }, h(CS.Badge, { variant: CS.statusBadgeVariant(r[6]) }, r[6])),
            h('td', { className: 'text-right cell-chevron' }, h(CS.Icon, { name: 'chevronRight', size: 14 })));
        }))))
  );
}
ReactDOM.createRoot(document.getElementById('pv')).render(h(Demo));
</script>
</body>
</html>
